<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            margin: 0 20px;
        }

        p {
            font-size: 1.1rem;
            margin: 20px 20px 0 20px;
        }

        button {
            margin-top: 30px;
            padding: 12px 32px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            border: none;
            background: #0078d4;
            color: #fff;
        }

        @media (max-width: 600px) {
            body {
                padding-top: 40px;
            }

            h1 {
                font-size: 1.3rem;
            }

            button {
                width: 90%;
                max-width: 300px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <h1>你当前处于离线状态</h1>
    <p>请检查网络连接后重试</p>
    <button onclick="location.reload()">重试</button>
</body>

</html>
